<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <meta name="description" content="Amal Yaumi — catat dan evaluasi amalan harian dengan mudah.">
  <title>Amal Yaumi</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=20261122a">
</head>
<body>
  <div id="app">
    <header class="topbar"><a class="brand" href="#"><span class="brand-mark">ع</span><span><b>Amal Yaumi</b><small>Jaga amal, istiqamah setiap hari</small></span></a><button id="mobileMenu" class="icon-button" aria-label="Menu">☰</button><div class="top-user" id="topUser"></div></header>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <nav id="nav" class="nav">
          <button data-page="dashboard" class="nav-item active">▦ <span>Dashboard</span></button>
          <button data-page="amal" class="nav-item">✓ <span>Isi Amal Yaumi</span></button>
          <button data-page="recap" class="nav-item">▤ <span>Rekap Individu</span></button>
          <button data-page="kajian" class="nav-item">▶ <span>Pusat Kajian</span></button>
          <button data-page="donasi" class="nav-item">♡ <span>Donasi & Kajian Pro</span></button>
          <button data-page="admin" class="nav-item admin-only" hidden>⚙ <span>Panel Admin</span></button>
        </nav>
        <div class="sidebar-bottom"><div class="sidebar-note">Sedikit tetapi konsisten.<br><b>Semoga Allah menerima amal kita.</b></div><button id="logout" class="logout" hidden>Keluar akun</button></div>
      </aside>
      <main id="main" class="main"><section class="loading">Memuat aplikasi...</section></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="authScreen" class="auth-screen" hidden>
    <div class="auth-card">
      <div class="brand auth-brand"><span class="brand-mark">ع</span><span><b>Amal Yaumi</b><small>Jaga amal, istiqamah setiap hari</small></span></div>
      <h1 id="authTitle">Selamat datang</h1><p class="muted" id="authDescription">Masuk untuk mencatat amal harian Anda.</p>
      <form id="authForm"><label>Email<input id="email" type="email" autocomplete="username" required placeholder="nama@email.com"></label><label>Kata sandi<input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Minimal 6 karakter"></label><label id="nameField" hidden>Nama lengkap<input id="displayName" type="text" autocomplete="name" placeholder="Nama Anda"></label><button class="primary full" id="authSubmit">Masuk</button></form>
      <div class="auth-actions"><button id="toggleAuth" class="link-button">Belum punya akun? Daftar</button><button id="forgotPassword" class="link-button">Lupa kata sandi?</button></div>
      <p class="tiny muted">Akses akun hanya untuk anggota komunitas.</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261122a"></script>
  <script src="./app.js?v=20261122a"></script>
</body>
</html>
